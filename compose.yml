services:
    postgres:
        image: postgres:17
        container_name: enron-postgres
        environment:
            POSTGRES_DB: ${DB_NAME:-enron}
            POSTGRES_USER: ${DB_USER:-enron}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-enron}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./services/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    postgres-data:
