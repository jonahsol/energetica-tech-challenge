services:
    mysql:
        image: mysql:9.7
        container_name: enron-mysql
        environment:
            MYSQL_DATABASE: enron
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
