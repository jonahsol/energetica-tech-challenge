spring:
  application:
    name: enron-search
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enron}
    username: ${DB_USER:enron}
    password: ${DB_PASSWORD:enron}
    hikari:
      connection-init-sql: SET pg_trgm.similarity_threshold = 0.35

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
